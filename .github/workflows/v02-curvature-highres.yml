name: V0.2 High-Resolution Curvature Convergence

on:
  push:
    branches:
      - dev/v0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  curvature-highres:
    name: High-resolution A0 convergence
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation.txt

      - name: Run full curvature convergence diagnostic
        run: python -m simulations.v02_curvature_diagnostics --mode full

      - name: Run robust A0 domain extrapolation
        run: python -m simulations.v02_a0_extrapolation

      - name: Run planar-vs-large-n critical splitting diagnostic
        run: python -m simulations.v02_critical_splitting

      - name: Run zero-tension curvature convergence diagnostic
        run: python -m simulations.v02_qsigma_curvature

      - name: Upload high-resolution curvature evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-curvature-highres-${{ github.run_id }}
          path: results/v02_validation/
          if-no-files-found: warn
          retention-days: 90

name: V0.2 Scientific Validation

on:
  push:
    branches:
      - dev/v0.2
  pull_request:
    branches:
      - dev/v0.2
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v02-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation.txt
          python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest -q

  quick-validation:
    name: Quick scientific campaign
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation.txt

      - name: Run quick validation
        run: python -m validation.run_v01 --quick

      - name: Upload quick validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-quick-validation-${{ github.run_id }}
          path: results/v01_validation/
          if-no-files-found: warn
          retention-days: 30

  curvature-diagnostics:
    name: V0.2 curvature diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation.txt

      - name: Run G2 exploratory curvature diagnostics
        run: python -m simulations.v02_curvature_diagnostics --mode quick

      - name: Upload V0.2 curvature evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-curvature-${{ github.run_id }}
          path: results/v02_validation/
          if-no-files-found: warn
          retention-days: 90

  sigma-leading-prediction:
    name: V0.2 no-fit sigma prediction
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation.txt

      - name: Run G3 no-fit leading sigma prediction
        run: python -m simulations.v02_sigma_leading_prediction

      - name: Upload V0.2 sigma prediction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-sigma-prediction-${{ github.run_id }}
          path: results/v02_validation/
          if-no-files-found: warn
          retention-days: 90

  two-term-prediction:
    name: V0.2 two-term curvature prediction
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - unit-tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation.txt

      - name: Run exploratory independent two-term prediction
        run: python -m simulations.v02_two_term_prediction

      - name: Upload V0.2 two-term evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-two-term-${{ github.run_id }}
          path: results/v02_validation/
          if-no-files-found: warn
          retention-days: 90

  full-validation:
    name: Full scientific campaign
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - unit-tests
      - quick-validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation.txt

      - name: Record runner environment
        run: |
          python --version
          python -m pip freeze
          uname -a

      - name: Run full validation
        run: python -m validation.run_v01 --full

      - name: Upload full validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-full-validation-${{ github.run_id }}
          path: results/v01_validation/
          if-no-files-found: warn
          retention-days: 90

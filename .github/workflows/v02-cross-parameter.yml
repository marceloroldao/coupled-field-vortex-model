name: V0.2 Cross-Parameter Critical Splitting

on:
  push:
    branches:
      - dev/v0.2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-parameter:
    name: Nearby-parameter split test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-validation.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-validation.txt

      - name: Run cross-parameter critical-splitting diagnostic
        run: python -m simulations.v02_cross_parameter_split

      - name: Upload cross-parameter evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v02-cross-parameter-${{ github.run_id }}
          path: results/v02_validation/
          if-no-files-found: warn
          retention-days: 90
